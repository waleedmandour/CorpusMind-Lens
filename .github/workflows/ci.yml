name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: lens-engine (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lens-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ocr,encryption]"
      - name: Test
        run: pytest -q
      - name: Lint (ruff)
        run: ruff check lens_engine || true   # advisory until first tag

  web:
    name: lens-web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lens-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Type-check + build
        run: npm run build

  desktop:
    name: lens-desktop (cargo check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lens-desktop/src-tauri
      - name: Stub sidecar binaries (release pipeline ships the real ones)
        run: |
          mkdir -p lens-desktop/binaries/lens-engine
          printf 'placeholder — real lens-engine sidecar is built by release.yml\n' \
            > lens-desktop/binaries/lens-engine/lens-engine
      - name: cargo check
        working-directory: lens-desktop/src-tauri
        run: cargo check --all-targets
