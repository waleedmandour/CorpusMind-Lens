name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash   # Windows runner would otherwise feed these scripts to pwsh

# Lens's own release pipeline (§12/§15 Phase 4): engine sidecar (PyInstaller)
# + desktop bundles + tagged release, built from this repo only — never as a
# secondary target of another product's workflow (the parent's regression).
#
# Layout (v0.3.1 — no Actions artifact store at all):
#   The first v0.3.1 release run died uploading build intermediates:
#   "Artifact storage quota has been hit" (two days of release runs had
#   accumulated 15.8 GB of engine/desktop artifacts, and usage is only
#   recalculated every 6-12 hours). Intermediates were pure waste — every
#   byte ships inside the release assets anyway. So the pipeline now builds
#   the sidecar AND the installers in ONE job per OS and attaches the
#   installers DIRECTLY to the tagged release (release assets are not part
#   of the Actions storage quota). Nothing ever touches upload-artifact.
#   1. create-release — extracts the first CHANGELOG section as the notes
#      and creates the release, so the platform jobs only upload files
#      (no create/edit races between parallel jobs).
#   2. platform (matrix: linux / windows / macos-universal) — PyInstaller
#      sidecar ([models] stack bundled: CPU-only torch + transformers +
#      sentence-transformers, so detection and CLIP work out of the box),
#      per-platform smoke of the FROZEN binary, fresh lens-web build,
#      tauri bundle, `gh release upload` of that platform's installers.
#      macOS builds BOTH sidecar architectures in the same job (arm64
#      CPython + x64 CPython under Rosetta 2 — GitHub no longer ships
#      Intel runners) for the universal app; the shell picks the matching
#      sidecar at runtime via its ARCH suffix.
#   3. verify-release — asserts the release carries exactly the five
#      installers with the tag's version in their names.
jobs:
  create-release:
    name: Create the tagged release with notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG
        run: |
          # First version section: from the first '## ' heading up to (not
          # including) the next one. The previous awk exited AT the heading
          # and captured only the preamble above it.
          awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "See CHANGELOG.md for the full release notes." > RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: a re-run of a partially failed release must not die here.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release for $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
      - name: Zenodo note
        run: |
          echo "On this first tagged release, mint/confirm the reserved DOI" \
               "10.5281/zenodo.21673083 against this repository (§12, §19)."

  platform:
    name: sidecar + installers (${{ matrix.name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ── Engine sidecar (PyInstaller) ────────────────────────────────────
      # macOS-universal runs this whole block TWICE (arm64 + x64 CPython)
      # and keeps both binaries; Linux/Windows build once.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.name == 'macos-universal' && 'arm64' || 'x64' }}
      - name: Build sidecar (native arch)
        working-directory: lens-engine
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          # [models] extra = torch + transformers + sentence-transformers.
          # CPU-only wheels via the pytorch cpu index (no CUDA payloads on
          # Linux/Windows); macOS cpu wheels come from the same index.
          pip install pyinstaller ".[models]" --extra-index-url https://download.pytorch.org/whl/cpu
          python -m PyInstaller --onefile --name lens-engine \
            --collect-all openpyxl --collect-all et_xmlfile \
            --collect-all torch --collect-all transformers \
            --collect-all sentence_transformers --collect-all tokenizers \
            --collect-all safetensors --collect-all scipy --collect-all sklearn \
            --add-data "../reference-data/frameworks${SEP}reference-data/frameworks" \
            --add-data "../reference-data/reference-corpora${SEP}reference-data/reference-corpora" \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.logging \
            lens_engine/__main__.py
          mkdir -p ../lens-desktop/binaries/lens-engine
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/lens-engine ../lens-desktop/binaries/lens-engine/lens-engine-aarch64
          else
            cp dist/lens-engine* ../lens-desktop/binaries/lens-engine/
          fi
          rm -rf build dist lens_engine.spec

      # x64 sidecar for the universal macOS build (x64 CPython under Rosetta 2).
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: "3.12"
          architecture: x64
      - name: Build sidecar (x64 via Rosetta 2)
        if: runner.os == 'macOS'
        working-directory: lens-engine
        run: |
          # Calling setup-python twice does not reliably move PATH, so drive
          # the x64 interpreter by its explicit tool-cache path. The frozen
          # binary inherits the interpreter's architecture (x86_64).
          X64_PY=$(find "${RUNNER_TOOL_CACHE:-$HOME/hostedtoolcache}/Python" \
                       -path '*x64/bin/python3' 2>/dev/null | head -1)
          if [ -z "$X64_PY" ]; then echo "x64 CPython not found in tool cache"; exit 1; fi
          echo "x64 interpreter: $X64_PY"
          "$X64_PY" -c "import platform; assert platform.machine() == 'x86_64', platform.machine()"
          "$X64_PY" -m pip install pyinstaller ".[models]" --extra-index-url https://download.pytorch.org/whl/cpu
          "$X64_PY" -m PyInstaller --onefile --name lens-engine \
            --collect-all openpyxl --collect-all et_xmlfile \
            --collect-all torch --collect-all transformers \
            --collect-all sentence_transformers --collect-all tokenizers \
            --collect-all safetensors --collect-all scipy --collect-all sklearn \
            --add-data "../reference-data/frameworks:reference-data/frameworks" \
            --add-data "../reference-data/reference-corpora:reference-data/reference-corpora" \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.logging \
            lens_engine/__main__.py
          cp dist/lens-engine ../lens-desktop/binaries/lens-engine/lens-engine-x86_64
          rm -rf build dist lens_engine.spec
      - name: Make sidecars executable (macOS)
        if: runner.os == 'macOS'
        run: chmod +x lens-desktop/binaries/lens-engine/lens-engine-*
      - name: Make sidecar executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x lens-desktop/binaries/lens-engine/lens-engine

      # ── Smoke tests on the FROZEN binary ────────────────────────────────
      # The v0.2.0 release shipped a sidecar that was missing routes:
      # PyInstaller cannot see dynamically imported modules, and the
      # hand-maintained hidden-import list had drifted. main.py now imports
      # every router statically; this guard keeps the guarantee honest.
      - name: Smoke test the frozen sidecar (routes, Linux only)
        if: runner.os == 'Linux'
        working-directory: lens-engine
        run: |
          LENS_DATA_DIR="$PWD/.smoke-data" LENS_PORT=8798 \
            LENS_HOST=127.0.0.1 ../lens-desktop/binaries/lens-engine/lens-engine > .smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill $SIDECAR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8798/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8798/api/v1/health
          echo
          curl -sf http://127.0.0.1:8798/openapi.json -o .smoke-openapi.json
          python3 - <<'PY'
          import json, sys
          paths = set(json.load(open(".smoke-openapi.json"))["paths"].keys())
          required = [
              "/api/v1/projects",
              "/api/v1/imagesets/{set_id}/images",
              "/api/v1/imagesets/{set_id}/battery/full",
              "/api/v1/discourse/frameworks",
              "/api/v1/assistant/tools",
              "/api/v1/settings",
              "/api/v1/ai/local/status",
              "/api/v1/ai/catalog",
              "/api/v1/imagesets/{set_id}/semantic-search",
              "/api/v1/projects/{project_id}/posts",
              "/api/v1/projects/{project_id}/social/import",
              "/api/v1/projects/{project_id}/social/fetch",
              "/api/v1/projects/{project_id}/social-export/posts",
              "/api/v1/imagesets/{set_id}/text/concordance",
              "/api/v1/imagesets/{set_id}/text/collocations",
              "/api/v1/imagesets/{set_id}/text/keyness-reference",
              "/api/v1/imagesets/{set_id}/text/references",
              "/api/v1/projects/{project_id}/stoplists",
              "/api/v1/troubleshoot/interpret",
              "/api/v1/settings/models",
          ]
          missing = [p for p in required if p not in paths]
          print(f"frozen sidecar exposes {len(paths)} paths")
          if missing:
              print("MISSING ROUTES:", missing)
              sys.exit(1)
          PY
          if grep -q "router_not_registered" .smoke.log; then
            echo "::error::router_not_registered in frozen sidecar log"
            cat .smoke.log
            exit 1
          fi
          rm -rf .smoke-data .smoke.log .smoke-openapi.json
          echo "frozen sidecar smoke test passed"
      # The v0.2.0 audit's meta-finding: nothing in CI ever RAN the built
      # app, so a compile-clean packaging regression shipped silently. Boot
      # the freshly built sidecar on each platform and demand a healthy
      # /health with the capabilities report before any installer is made.
      - name: Smoke test the built sidecar (capabilities)
        working-directory: lens-desktop/binaries/lens-engine
        env:
          SMOKE_DATA_DIR: ${{ runner.temp }}/lens-smoke-data
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          port = "8799"
          # macOS carries ARCH-suffixed sidecars for the universal build;
          # smoke the native-arch one. Data dir lives in runner.temp so no
          # smoke residue can leak into the bundled resources directory.
          if sys.platform == "darwin":
              exe = os.path.abspath("lens-engine-aarch64")
          else:
              exe = os.path.abspath("lens-engine" + (".exe" if os.name == "nt" else ""))
          data_dir = os.environ.get("SMOKE_DATA_DIR") or os.path.abspath("smoke-data")
          env = {**os.environ, "LENS_HOST": "127.0.0.1", "LENS_PORT": port,
                 "LENS_DATA_DIR": data_dir}
          proc = subprocess.Popen([exe], env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              deadline = time.time() + 300   # onefile self-extract of the torch stack is slow
              body = None
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:{port}/api/v1/health", timeout=3) as r:
                          body = json.loads(r.read().decode())
                          break
                  except Exception:
                      if proc.poll() is not None:
                          print("sidecar exited early with code", proc.returncode)
                          sys.exit(1)
                      time.sleep(3)
              if body is None:
                  print("sidecar never became healthy within 300s")
                  sys.exit(1)
              caps = body.get("capabilities") or {}
              missing = [k for k in ("vision_models", "alignment_embeddings") if k not in caps]
              if missing:
                  print("capabilities missing keys:", missing)
                  sys.exit(1)
              print("smoke OK:", body["product"], body["version"],
                    "| vision_models bundled:", caps["vision_models"]["available"])
          finally:
              proc.terminate()
          PY

      # ── Desktop bundles (Tauri) ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Extra rust targets (universal macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lens-desktop/src-tauri
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libfuse2
      - name: Build web bundle
        working-directory: lens-web
        run: npm install && npm run build
      - name: Install Tauri CLI (prebuilt binary via npm)
        run: npm install -g @tauri-apps/cli@^2
      - name: Tauri build (universal macOS — Intel + Apple Silicon)
        if: runner.os == 'macOS'
        working-directory: lens-desktop
        run: tauri build --target universal-apple-darwin
      - name: Tauri build
        if: runner.os != 'macOS'
        working-directory: lens-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # AppImage tooling without FUSE
        run: tauri build

      # ── Attach this platform's installers directly to the release ──────
      # (release assets are free; Actions artifacts are what hit the quota)
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          B="lens-desktop/src-tauri/target"
          if [ "$RUNNER_OS" = "macOS" ]; then B="$B/universal-apple-darwin/release/bundle"; else B="$B/release/bundle"; fi
          mkdir -p stage
          if [ "$RUNNER_OS" = "Linux" ]; then
            find "$B/deb" -type f -name '*.deb' -exec cp {} stage/ \;
            find "$B/appimage" -type f -name '*.AppImage' -exec cp {} stage/ \;
            WANT=2
          elif [ "$RUNNER_OS" = "macOS" ]; then
            find "$B/dmg" -type f -name '*.dmg' -exec cp {} stage/ \;
            WANT=1
          else
            find "$B/nsis" -type f -name '*-setup.exe' -exec cp {} stage/ \;
            find "$B/msi" -type f -name '*.msi' -exec cp {} stage/ \;
            WANT=2
          fi
          GOT=$(ls stage | wc -l)
          echo "staged $GOT installers (want $WANT)"; ls -la stage/
          if [ "$GOT" -ne "$WANT" ]; then
            echo "::error::expected $WANT installers, got $GOT"; exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" stage/* \
            --repo "$GITHUB_REPOSITORY" --clobber

  verify-release:
    name: Verify the release carries the five installers
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - name: Asset check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}",
              headers={"Authorization": f"token {os.environ['GH_TOKEN']}"})
          release = json.load(urllib.request.urlopen(req))
          names = [a["name"] for a in release["assets"]]
          print("assets:", *names, sep="\n  ")
          expected = [
              f"CorpusMind.Lens_{version}_amd64.AppImage",
              f"CorpusMind.Lens_{version}_amd64.deb",
              f"CorpusMind.Lens_{version}_universal.dmg",
              f"CorpusMind.Lens_{version}_x64-setup.exe",
              f"CorpusMind.Lens_{version}_x64_en-US.msi",
          ]
          missing = [e for e in expected if e not in names]
          if missing:
              print("MISSING:", missing)
              sys.exit(1)
          extra = [n for n in names if n not in expected]
          if extra:
              print("UNEXPECTED extras at publish time:", extra)
          print("release asset check passed:", len(names), "assets")
          PY
