[package]
name = "corpusmind-lens"
version = "0.2.0"
description = "CorpusMind Lens desktop shell (Tauri 2) — local-first visual & multimodal corpus analysis. Manages the lens-engine sidecar lifecycle and OS integration."
authors = ["Dr. Waleed Mandour", "Prof. Wesam Ibrahim"]
license = "AGPL-3.0-only"
repository = "https://github.com/waleedmandour/CorpusMind-Lens"
edition = "2021"
rust-version = "1.77"

[lib]
name = "corpusmind_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
sysinfo = "0.31"

[profile.release]
strip = true
lto = true
codegen-units = 1
