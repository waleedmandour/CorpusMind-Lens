[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lens-engine"
version = "0.1.0"
description = "CorpusMind Lens engine — local-first visual & multimodal corpus analysis (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
# Affiliations are recorded in CITATION.cff and README.md (PEP 621 authors
# entries carry a name and email only).
authors = [
    { name = "Waleed Mandour" },
    { name = "Wesam Ibrahim" },
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "Pillow>=10.2",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]
models = [
    "torch>=2.2",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["lens_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
