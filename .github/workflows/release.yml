name: Release

on:
  push:
    tags: ["v*"]

# Lens's own release pipeline (§12/§15 Phase 4): engine sidecar (PyInstaller)
# + desktop bundles + tagged release, built from this repo only — never as a
# secondary target of another product's workflow (the parent's regression).
#
# Layout:
#   1. engine-binaries — PyInstaller onefile sidecar per OS/CPU: Linux x64,
#      Windows x64, macOS arm64 (Apple Silicon) AND macOS x64 (x64 CPython
#      under Rosetta 2 on the arm64 runner — GitHub no longer ships Intel
#      runners), each bundling the 12 discourse frameworks via --add-data.
#      v0.2.1: the sidecar ALSO bundles the heavyweight [models] stack
#      (CPU-only torch + transformers + sentence-transformers), so object
#      detection and CLIP scene/alignment analysis work out of the box in
#      every installer instead of silently degrading to heuristics with no
#      way back (the exact packaging gap the v0.2.0 release notes blamed
#      for the rebuild). CPU wheels come from the pytorch cpu index so the
#      Linux/Windows artifacts stay CUDA-free; installers are larger
#      (hundreds of MB) and first launch self-extracts more slowly.
#      /api/v1/health capabilities and the Settings screen report the
#      stacks honestly either way.
#      These are CI artifacts only: the desktop job downloads them to bundle
#      them INSIDE the installers (bundle.resources), and they are NOT
#      attached to the GitHub release — end users download exactly one
#      installer per platform (single-package UX, v0.1.1). Headless/Docker
#      users get the engine via the published Docker image instead.
#   2. desktop — Tauri bundles: deb+AppImage, NSIS .exe+WiX .msi, and a
#      universal-apple-darwin .app/.dmg covering BOTH Intel and Apple Silicon
#      (the shell picks the matching sidecar at runtime via its ARCH suffix).
#   3. github-release — attaches the 5 installers to the tagged release.
jobs:
  engine-binaries:
    name: lens-engine sidecar (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: lens-engine-linux
          - os: windows-latest
            artifact: lens-engine-windows
          - os: macos-latest
            artifact: lens-engine-macos-arm64
            python-arch: arm64
          - os: macos-latest
            artifact: lens-engine-macos-x64
            python-arch: x64   # x64 CPython under Rosetta 2 → x86_64 sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch || 'x64' }}
      - name: Build sidecar
        working-directory: lens-engine
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; fi
          # [models] extra = torch + transformers + sentence-transformers.
          # CPU-only wheels via the pytorch cpu index (no CUDA payloads on
          # Linux/Windows); macOS cpu wheels come from the same index.
          pip install pyinstaller ".[models]" --extra-index-url https://download.pytorch.org/whl/cpu
          pyinstaller --onefile --name lens-engine \
            --collect-all openpyxl --collect-all et_xmlfile \
            --collect-all torch --collect-all transformers \
            --collect-all sentence_transformers --collect-all tokenizers \
            --collect-all safetensors --collect-all scipy --collect-all sklearn \
            --add-data "../reference-data/frameworks${SEP}reference-data/frameworks" \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.protocols.http.httptools_impl \
            --hidden-import uvicorn.protocols.websockets.websockets_impl \
            --hidden-import uvicorn.protocols.websockets.wsproto_impl \
            --hidden-import uvicorn.logging \
            lens_engine/__main__.py
      - name: Smoke test the frozen sidecar (Linux only)
        if: runner.os == 'Linux'
        working-directory: lens-engine
        shell: bash
        run: |
          # The v0.2.0 release shipped a sidecar that was missing routes:
          # PyInstaller cannot see dynamically imported modules, and the
          # hand-maintained hidden-import list had drifted. main.py now
          # imports every router statically, but this guard keeps the
          # guarantee honest: the FROZEN binary must expose the complete
          # API surface and boot with zero router warnings.
          LENS_DATA_DIR="$PWD/.smoke-data" LENS_PORT=8798 \
            LENS_HOST=127.0.0.1 ./dist/lens-engine > .smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap 'kill $SIDECAR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8798/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8798/api/v1/health
          echo
          curl -sf http://127.0.0.1:8798/openapi.json -o .smoke-openapi.json
          python3 - <<'PY'
          import json, sys
          paths = set(json.load(open(".smoke-openapi.json"))["paths"].keys())
          required = [
              "/api/v1/projects",
              "/api/v1/imagesets/{set_id}/images",
              "/api/v1/imagesets/{set_id}/battery/full",
              "/api/v1/discourse/frameworks",
              "/api/v1/assistant/tools",
              "/api/v1/settings",
              "/api/v1/ai/local/status",
              "/api/v1/ai/catalog",
              "/api/v1/imagesets/{set_id}/semantic-search",
              "/api/v1/projects/{project_id}/posts",
              "/api/v1/projects/{project_id}/social/import",
              "/api/v1/projects/{project_id}/social/fetch",
              "/api/v1/projects/{project_id}/social-export/posts",
          ]
          missing = [p for p in required if p not in paths]
          print(f"frozen sidecar exposes {len(paths)} paths")
          if missing:
              print("MISSING ROUTES:", missing)
              sys.exit(1)
          PY
          if grep -q "router_not_registered" .smoke.log; then
            echo "::error::router_not_registered in frozen sidecar log"
            cat .smoke.log
            exit 1
          fi
          rm -rf .smoke-data .smoke.log .smoke-openapi.json
          echo "frozen sidecar smoke test passed"
      # The v0.2.0 audit's meta-finding: nothing in CI ever RAN the built
      # app, so a compile-clean packaging regression shipped silently. Boot
      # the freshly built sidecar on each platform and demand a healthy
      # /health with the capabilities report before the artifact uploads.
      - name: Smoke test the built sidecar
        working-directory: lens-engine
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, time, urllib.request
          port = "8799"
          exe = os.path.abspath("dist/lens-engine" + (".exe" if os.name == "nt" else ""))
          env = {**os.environ, "LENS_HOST": "127.0.0.1", "LENS_PORT": port,
                 "LENS_DATA_DIR": os.path.abspath("smoke-data")}
          proc = subprocess.Popen([exe], env=env,
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              deadline = time.time() + 300   # onefile self-extract of the torch stack is slow
              body = None
              while time.time() < deadline:
                  try:
                      with urllib.request.urlopen(
                          f"http://127.0.0.1:{port}/api/v1/health", timeout=3) as r:
                          body = json.loads(r.read().decode())
                          break
                  except Exception:
                      if proc.poll() is not None:
                          print("sidecar exited early with code", proc.returncode)
                          sys.exit(1)
                      time.sleep(3)
              if body is None:
                  print("sidecar never became healthy within 300s")
                  sys.exit(1)
              caps = body.get("capabilities") or {}
              missing = [k for k in ("vision_models", "alignment_embeddings") if k not in caps]
              if missing:
                  print("capabilities missing keys:", missing)
                  sys.exit(1)
              print("smoke OK:", body["product"], body["version"],
                    "| vision_models bundled:", caps["vision_models"]["available"])
          finally:
              proc.terminate()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: lens-engine/dist/lens-engine*
          if-no-files-found: error

  desktop:
    name: desktop bundles (${{ matrix.name }})
    needs: engine-binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos-universal
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: dtolnay/rust-toolchain@stable
      - name: Extra rust targets (universal macOS)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lens-desktop/src-tauri
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libfuse2
      - name: Build web bundle
        working-directory: lens-web
        run: npm install && npm run build

      - name: Place engine sidecar (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: lens-engine-linux
          path: lens-desktop/binaries/lens-engine
      - name: Make sidecar executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x lens-desktop/binaries/lens-engine/lens-engine
      - name: Place engine sidecar (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: lens-engine-windows
          path: lens-desktop/binaries/lens-engine
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: lens-engine-macos-arm64
          path: lens-desktop/binaries/dl/arm64
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: lens-engine-macos-x64
          path: lens-desktop/binaries/dl/x64
      - name: Rename macOS sidecars (ARCH-suffixed)
        if: runner.os == 'macOS'
        run: |
          mkdir -p lens-desktop/binaries/lens-engine
          cp lens-desktop/binaries/dl/arm64/lens-engine lens-desktop/binaries/lens-engine/lens-engine-aarch64
          cp lens-desktop/binaries/dl/x64/lens-engine lens-desktop/binaries/lens-engine/lens-engine-x86_64
          chmod +x lens-desktop/binaries/lens-engine/lens-engine-*
          ls -l lens-desktop/binaries/lens-engine/

      - name: Install Tauri CLI (prebuilt binary via npm)
        run: npm install -g @tauri-apps/cli@^2
      - name: Tauri build (universal macOS — Intel + Apple Silicon)
        if: runner.os == 'macOS'
        working-directory: lens-desktop
        run: tauri build --target universal-apple-darwin
      - name: Tauri build
        if: runner.os != 'macOS'
        working-directory: lens-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # AppImage tooling without FUSE
        run: tauri build
      # Two patterns on purpose: plain `release` (Linux/Windows native builds)
      # AND `<triple>/release` (macOS universal-apple-darwin). A single
      # `*/release/...` glob silently matches nothing on native builds.
      - uses: actions/upload-artifact@v4
        with:
          name: lens-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            lens-desktop/src-tauri/target/release/bundle/**/*
            lens-desktop/src-tauri/target/*/release/bundle/**/*

  github-release:
    name: Tagged GitHub release
    needs: [engine-binaries, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Stage release assets (installers only — one file per platform)
        run: |
          mkdir -p release-assets
          # Installers ONLY. The lens-engine sidecar ships INSIDE every
          # installer (bundle.resources) — a separate engine download is
          # never needed by end users (single-package UX, v0.1.1). Engine
          # binaries remain available as CI artifacts for headless/CLI use;
          # headless/Docker users use the published Docker image.
          find dist -type f -name '*.deb'       -exec cp {} release-assets/ \;
          find dist -type f -name '*.AppImage'  -exec cp {} release-assets/ \;
          find dist -type f -name '*-setup.exe' -exec cp {} release-assets/ \;
          find dist -type f -name '*.msi'       -exec cp {} release-assets/ \;
          find dist -type f -name '*.dmg'       -exec cp {} release-assets/ \;
          COUNT=$(ls release-assets | wc -l)
          echo "staged $COUNT assets"; ls -la release-assets/
          if [ "$COUNT" -ne 5 ]; then
            echo "::error::expected exactly 5 installers (deb/AppImage/setup-exe/msi/dmg), got $COUNT"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG
        run: |
          # First version section: from the first '## ' heading up to (not
          # including) the next one. The previous awk exited AT the heading
          # and captured only the preamble above it.
          awk '/^## /{c++} c==1{print} c==2{exit}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "See CHANGELOG.md for the full release notes." > RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Zenodo note
        run: |
          echo "On this first tagged release, mint/confirm the reserved DOI" \
               "10.5281/zenodo.21673083 against this repository (§12, §19)."
